name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: fintrack
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: fintrack
      DATABASE_SSLMODE: disable
      SECRET_KEY: ci-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ADMIN_KEY: ci-admin-key
      BRAPI_TOKEN: ""
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack
          POSTGRES_DB: fintrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintrack -d fintrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv sync --locked
      - name: Run migrations
        run: uv run --locked sh release.sh
      - name: Run tests
        run: uv run --locked pytest -q

  production-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated production image
        run: docker compose -p fintrack-release-ci -f docker-compose.validation.yml build
      - name: Start database and run release once
        run: |
          docker compose -p fintrack-release-ci -f docker-compose.validation.yml up -d --wait db
          docker compose -p fintrack-release-ci -f docker-compose.validation.yml run --rm --no-deps release
      - name: Start API without migrations
        run: docker compose -p fintrack-release-ci -f docker-compose.validation.yml up -d --no-deps --wait --wait-timeout 120 web
      - name: Verify runtime and complete HTTP flow
        run: docker compose -p fintrack-release-ci -f docker-compose.validation.yml exec -T web python -m scripts.check_release
      - name: Graceful shutdown
        run: |
          docker compose -p fintrack-release-ci -f docker-compose.validation.yml stop -t 30 web
          docker compose -p fintrack-release-ci -f docker-compose.validation.yml logs --no-color web | tee /tmp/fintrack-shutdown.log
          grep -q 'Application shutdown complete' /tmp/fintrack-shutdown.log
      - name: Logs and cleanup
        if: always()
        run: |
          docker compose -p fintrack-release-ci -f docker-compose.validation.yml logs --no-color
          docker compose -p fintrack-release-ci -f docker-compose.validation.yml down --volumes
