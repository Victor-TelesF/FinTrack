# Isolated release check: no source mounts, real credentials or host ports.
# Always use a dedicated project name and remove only this project's volumes.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: release_test
      POSTGRES_PASSWORD: release_test
      POSTGRES_DB: release_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U release_test -d release_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    build: .
    environment:
      POSTGRES_USER: release_test
      POSTGRES_PASSWORD: release_test
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: release_test
      SECRET_KEY: synthetic-release-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ADMIN_KEY: synthetic-release-admin
      BRAPI_TOKEN: ""
      FRONTEND_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=3)"]
      interval: 2s
      timeout: 3s
      retries: 30
